name: post-server

services:
  post-server:
    build: .
    image: post-server:local
    expose:
      - "8080"
    environment:
      TRUST_PROXY: "true"
    networks:
      - backend
    volumes:
      - request-logs:/app/logs
    restart: unless-stopped
    stop_grace_period: 10s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  https:
    image: caddy:2.11.7-alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    networks:
      - frontend
      - backend
    depends_on:
      post-server:
        condition: service_healthy
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

networks:
  frontend:
  backend:
    internal: true

volumes:
  request-logs:
    name: post-server-logs
  caddy-data:
    name: post-server-caddy-data
  caddy-config:
    name: post-server-caddy-config
